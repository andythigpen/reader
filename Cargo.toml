[workspace]
resolver = "2"
members = [
    "dto",
    "frontend",
    "frontend/components",
    "frontend/hooks",
    "frontend/pages",
    "frontend/router",
    "frontend/stores",
    "server",
    "server/api",
    "server/entity",
    "server/migration",
    "server/service"
]

[patch.crates-io]
anymap = { path = "anymap-patch" }

[profile.release]
lto = true
